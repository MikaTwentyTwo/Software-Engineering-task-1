apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: audit-internal
  namespace: campus
spec:
  hosts:
    - audit
    - audit.campus.svc.cluster.local
  gateways:
    - mesh
  http:
    - match:
        - method:
            exact: GET
      route:
        - destination:
            host: audit.campus.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 2
        perTryTimeout: 3s
        retryOn: connect-failure,reset,refused-stream,503
      timeout: 10s
    - route:
        - destination:
            host: audit.campus.svc.cluster.local
            port:
              number: 8000
      timeout: 15s
