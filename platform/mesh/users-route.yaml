apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: users-api
  namespace: campus
spec:
  hosts:
    - "*"
  gateways:
    - campus-api
  http:
    - match:
        - uri:
            prefix: /api/users/
      rewrite:
        uri: /
      route:
        - destination:
            host: users.campus.svc.cluster.local
            port:
              number: 8000
      timeout: 15s
