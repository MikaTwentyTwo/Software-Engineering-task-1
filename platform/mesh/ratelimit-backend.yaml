apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  namespace: campus
data:
  config.yaml: |
    domain: campus-api
    descriptors:
      - key: generic_key
        value: campus-global
        rate_limit:
          unit: second
          requests_per_unit: 20
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-ratelimit
  namespace: campus
spec:
  selector:
    app: valkey-ratelimit
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-ratelimit
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-ratelimit
  template:
    metadata:
      labels:
        app: valkey-ratelimit
    spec:
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: valkey/valkey:8.0.2-alpine
          args:
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit
  namespace: campus
spec:
  selector:
    app: ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit
  namespace: campus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratelimit
  template:
    metadata:
      labels:
        app: ratelimit
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ratelimit
          image: envoyproxy/ratelimit:cfdbd87a
          ports:
            - containerPort: 8081
          env:
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: valkey-ratelimit:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_APPDIRECTORY
              value: config
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
            - name: CONFIG_TYPE
              value: FILE
            - name: USE_STATSD
              value: "false"
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ratelimit-config
