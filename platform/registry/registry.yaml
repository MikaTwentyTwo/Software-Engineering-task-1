apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-registry-data
  namespace: campus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-registry
  namespace: campus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: local-registry
  template:
    metadata:
      labels:
        app: local-registry
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_HTTP_ADDR
              value: "0.0.0.0:5000"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: OTEL_TRACES_EXPORTER
              value: none
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: local-registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: local-registry
  namespace: campus
spec:
  type: NodePort
  selector:
    app: local-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 32000