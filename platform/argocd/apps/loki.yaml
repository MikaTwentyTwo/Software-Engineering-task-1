apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.13.8
    helm:
      releaseName: campus-loki
      values: |
        deploymentMode: Monolithic

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 24h
            ingestion_rate_mb: 1
            ingestion_burst_size_mb: 2
            max_query_parallelism: 2
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          querier:
            max_concurrent: 1

        singleBinary:
          replicas: 1
          sidecar: false
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          persistence:
            enabled: true
            size: 3Gi
            storageClass: standard
          extraEnv:
            - name: GOMEMLIMIT
              value: 400MiB

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0

        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        minio:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true