apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.2.7
    helm:
      releaseName: campus-grafana
      values: |
        replicas: 1
        deploymentStrategy:
          type: Recreate
        admin:
          existingSecret: grafana-admin
          userKey: username
          passwordKey: password
        persistence:
          enabled: true
          size: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /api/health
            port: grafana
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: grafana
          periodSeconds: 10
          timeoutSeconds: 5
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://campus-prometheus-server.monitoring.svc.cluster.local
                isDefault: true
                editable: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
