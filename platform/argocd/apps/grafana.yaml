apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.2.7
    helm:
      releaseName: campus-grafana
      values: |
        replicas: 1
        deploymentStrategy:
          type: Recreate
        admin:
          existingSecret: grafana-admin
          userKey: username
          passwordKey: password
        persistence:
          enabled: true
          size: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /api/health
            port: grafana
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: grafana
          periodSeconds: 10
          timeoutSeconds: 5
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: campus
                orgId: 1
                folder: Campus
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/campus
        dashboards:
          campus:
            service-overview:
              json: |
                {
                  "uid": "campus-services",
                  "title": "Campus — Services",
                  "schemaVersion": 39,
                  "version": 1,
                  "refresh": "30s",
                  "time": {"from": "now-30m", "to": "now"},
                  "panels": [
                    {
                      "id": 1,
                      "title": "Istio proxies available",
                      "type": "stat",
                      "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum(up{job=\"istio-proxies\"})", "instant": true}],
                      "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
                    },
                    {
                      "id": 2,
                      "title": "Requests per second by service",
                      "type": "timeseries",
                      "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0},
                      "datasource": {"type": "prometheus", "uid": "prometheus"},
                      "targets": [{"refId": "A", "expr": "sum by (destination_service_name) (rate(istio_requests_total{reporter=\"destination\"}[5m]))", "legendFormat": "{{destination_service_name}}"}],
                      "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []}
                    }
                  ]
                }
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://campus-prometheus-server.monitoring.svc.cluster.local
                isDefault: true
                editable: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
