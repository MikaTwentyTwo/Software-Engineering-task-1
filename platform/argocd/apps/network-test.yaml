apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-network-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MikaTwentyTwo/Software-Engineering-task-1.git
    targetRevision: main
    path: platform/tests
  destination:
    server: https://kubernetes.default.svc
    namespace: network-test
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
