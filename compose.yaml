services:
  kafka-permissions:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    - ./infra/init.sql:/bootstrap/init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    depends_on:
      kafka-permissions:
        condition: service_completed_successfully
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
    - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - /opt/kafka/bin/kafka-topics.sh
    command:
    - --bootstrap-server
    - kafka:9092
    - --create
    - --if-not-exists
    - --topic
    - campus.events.v1
    - --partitions
    - '6'
    - --replication-factor
    - '1'
    - --config
    - retention.ms=604800000
  valkey:
    image: valkey/valkey:8.0.2-alpine
    command:
    - valkey-server
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - allkeys-lru
  mongo-hot:
    image: mongo:7.0.18
    volumes:
    - mongo-hot-data:/data/db
  mongo-cold:
    image: mongo:7.0.18
    volumes:
    - mongo-cold-data:/data/db
  users:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: users
      DATABASE_URL: postgresql://users:${POSTGRES_PASSWORD}@postgres:5432/users
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:?Set STUDENT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  rooms:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: rooms
      DATABASE_URL: postgresql://rooms:${POSTGRES_PASSWORD}@postgres:5432/rooms
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  equipment:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: equipment
      DATABASE_URL: postgresql://equipment:${POSTGRES_PASSWORD}@postgres:5432/equipment
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  bookings-a:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: bookings
      DATABASE_URL: postgresql://bookings:${POSTGRES_PASSWORD}@postgres:5432/bookings
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  bookings-b:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: bookings
      DATABASE_URL: postgresql://bookings:${POSTGRES_PASSWORD}@postgres:5432/bookings
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  notifications:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: notifications
      DATABASE_URL: postgresql://notifications:${POSTGRES_PASSWORD}@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  audit:
    build: .
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET}
      REDIS_URL: redis://valkey:6379
      SERVICE: audit
      MONGO_HOT: mongodb://mongo-hot:27017
      MONGO_COLD: mongodb://mongo-cold:27017
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo-hot:
        condition: service_started
      mongo-cold:
        condition: service_started
  gateway:
    image: nginx:1.27.5-alpine
    ports:
    - 127.0.0.1:8080:80
    volumes:
    - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      users:
        condition: service_started
      rooms:
        condition: service_started
      equipment:
        condition: service_started
      bookings-a:
        condition: service_started
      bookings-b:
        condition: service_started
      notifications:
        condition: service_started
      audit:
        condition: service_started
volumes:
  postgres-data: {}
  kafka-data: {}
  mongo-hot-data: {}
  mongo-cold-data: {}
