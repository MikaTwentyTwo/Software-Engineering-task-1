events {}
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_status 429;
  upstream booking_pool {
    server bookings-a:8000;
    server bookings-b:8000;
  }
  server {
    listen 80;
    client_max_body_size 64k;
    limit_req zone=api burst=20 nodelay;
    location /api/users/ { proxy_pass http://users:8000/; }
    location /api/rooms/ { proxy_pass http://rooms:8000/; }
    location /api/equipment/ { proxy_pass http://equipment:8000/; }
    location /api/bookings/ { proxy_pass http://booking_pool/; }
    location /api/notifications/ { proxy_pass http://notifications:8000/; }
    location /api/audit/ { proxy_pass http://audit:8000/; }
    location = /health { return 200 'gateway alive'; }
  }
}
